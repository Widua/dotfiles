[bar.default]
capsule = true
capsule_thickness = 0.99999998137354851
center = [ "clock", "cat" ]
start = [ "launcher", "workspaces" ]

[calendar]
enabled = true

    [calendar.account.personal_google]
    color = "primary"
    type = "google"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 24
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 192.0
    box_width = 264.0
    cx = 936.0
    cy = 1800.0
    output = "DP-3"
    placement_height = 1920.0
    placement_width = 1080.0
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false

[dock]
active_monitor_only = true
auto_hide = true
launcher_position = "start"
layer = "overlay"
reserve_space = false
show_dots = true

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3", "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-2"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 540.0
    cy = 1738.0
    output = "DP-3"
    placement_height = 1920.0
    placement_width = 1080.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."nzlov/daily-wallpaper"]
panel_layer = "overlay"

[plugins]
auto_update = "official"
enabled = [ "nzlov/daily-wallpaper", "miixz/audio-sticker" ]

[shell]
font_family = "Roboto"
password_style = "random"
polkit_agent = true
settings_window_translucent = true

    [shell.launcher]
    category_icons_only = true
    compact = true
    default_view = "pinned"
    show_app_actions = true

        [shell.launcher.providers.wallpaper]
        global = false

    [shell.panel]
    floating_layer = "top"

    [shell.screen_corners]
    size = 5

    [shell.window_switcher]
    current_workspace_only = true
    mru = true
    show_all_outputs = false

[theme]
builtin = "Tokyo-Night"
community_palette = "Kanagawa Dragon"
mode = "dark"
pure_black_dark = true
source = "builtin"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt" ]
    community_ids = [ "opencode", "zen-browser", "discord", "neovim", "prismlauncher", "steam", "obs" ]

[wallpaper]
fill_mode = "center"

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/widua/Pictures/daily-wallpaper/bing-en-us-2026-11-06.jpg"

    [wallpaper.last]
    path = "/home/widua/Pictures/daily-wallpaper/bing-en-us-2026-11-06.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/widua/Pictures/daily-wallpaper/bing-en-us-2026-11-06.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/widua/Pictures/daily-wallpaper/bing-en-us-2026-11-06.jpg"

[widget.cat]
type = "noctalia/bongocat:cat"
